<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race Game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87ceeb; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #panel { background: #fff; padding: 28px 32px; border-radius: 14px; width: 280px; text-align: center; }
  #panel h1 { margin: 0 0 16px; font-size: 22px; }
  #panel input[type=text] { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; margin-bottom: 12px; }
  #panel label { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; font-size: 14px; }
  #panel input[type=color] { width: 60px; height: 32px; border: none; padding: 0; }
  #panel button { width: 100%; padding: 12px; font-size: 16px; border: none; border-radius: 8px; background: #3b82f6; color: #fff; cursor: pointer; }
  #hud { position: fixed; top: 10px; left: 12px; color: #fff; text-shadow: 0 1px 3px #000; font-size: 14px; line-height: 1.5; z-index: 5; pointer-events: none; }
  #help { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; color: #fff; text-shadow: 0 1px 3px #000; font-size: 13px; z-index: 5; pointer-events: none; }
  #toast { position: fixed; top: 18%; left: 0; right: 0; text-align: center; color: #fff; font-size: 32px; font-weight: bold; text-shadow: 0 2px 6px #000; z-index: 6; pointer-events: none; opacity: 0; transition: opacity .4s; }
</style>
</head>
<body>
<div id="overlay">
  <div id="panel">
    <h1>🏃 장애물 레이스</h1>
    <input id="name" type="text" maxlength="12" placeholder="닉네임">
    <label>캐릭터 색 <input id="color" type="color" value="#3b82f6"></label>
    <button id="start">입장하기</button>
  </div>
</div>
<div id="hud"></div>
<div id="toast"></div>
<div id="help">WASD 이동 · Space 점프 · 마우스 시점 (화면 클릭) · R 처음으로 · Esc 마우스 해제</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module" src="game.js"></script>
</body>
</html>
